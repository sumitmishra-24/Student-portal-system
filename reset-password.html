<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | Student Portal</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo">SP</div>

        <h1>Set New Password</h1>

        <p>
          Enter your new password below to reset and secure your Student Portal account.
        </p>
      </div>

      <form id="reset-password-form">
        <div class="form-group">
          <label for="new-password">New Password</label>

          <input
            type="password"
            id="new-password"
            placeholder="Enter new password"
            minlength="8"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm-new-password">Confirm New Password</label>

          <input
            type="password"
            id="confirm-new-password"
            placeholder="Confirm new password"
            minlength="8"
            required
          />
        </div>

        <button type="submit" class="login-btn">Update Password</button>

        <p id="update-message"></p>
      </form>

      <div class="signup-link">
        Remember your password?
        <a href="index.html">Back to Login</a>
      </div>

      <p class="footer-text">© 2026 Student Portal. All rights reserved.</p>
    </div>

    <!-- Supabase Official JavaScript Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Project Configuration -->
    <script src="supabase-config.js"></script>
    <!-- Authentication Logic -->
    <script src="auth.js"></script>
  </body>
</html>
